[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "improxope"
version = "0.1.0"
description = "ImProxOPE: off-policy evaluation with rewards missing not at random"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3",
    "scipy>=1.16",
    "pandas>=2.3",
    "scikit-learn>=1.7",
    "torch>=2.9",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3",
    "gymnasium>=1.2",
]

[tool.setuptools.packages.find]
include = ["improxope*"]
